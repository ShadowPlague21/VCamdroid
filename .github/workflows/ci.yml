name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache vcpkg installed
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: ${{ runner.os }}-vcpkg-deps-v2

      - name: Install vcpkg dependencies
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          vcpkg integrate install
          vcpkg install asio:x64-windows wxwidgets:x64-windows

      - name: Integrate vcpkg
        run: |
          vcpkg integrate install

      - name: Setup FFmpeg dependencies
        shell: pwsh
        run: |
          $depsZip = "windows-deps.zip"
          curl.exe -L -o $depsZip "https://github.com/obsproject/obs-deps/releases/download/2026-08-26/windows-deps-2026-08-26-x64.zip"
          New-Item -ItemType Directory -Force -Path C:\deps | Out-Null
          tar.exe -xf $depsZip -C C:\deps
          
          New-Item -ItemType Directory -Force -Path C:\vcpkg\installed\x64-windows\include | Out-Null
          New-Item -ItemType Directory -Force -Path C:\vcpkg\installed\x64-windows\lib | Out-Null
          New-Item -ItemType Directory -Force -Path C:\vcpkg\installed\x64-windows\bin | Out-Null
          
          Copy-Item -Path "C:\deps\include\*" -Destination "C:\vcpkg\installed\x64-windows\include\" -Recurse -Force
          Copy-Item -Path "C:\deps\lib\*" -Destination "C:\vcpkg\installed\x64-windows\lib\" -Recurse -Force
          Copy-Item -Path "C:\deps\bin\*" -Destination "C:\vcpkg\installed\x64-windows\bin\" -Recurse -Force
          Remove-Item $depsZip -Force

      - name: Build Softcam Library
        run: |
          nuget restore windows/3rdparty/softcam/softcam.sln
          msbuild windows/3rdparty/softcam/softcam.sln /t:softcam /p:Configuration=Release /p:Platform=x64 /m

      - name: Build Softcam Installer
        run: |
          msbuild windows/3rdparty/softcam/examples/softcam_installer/softcam_installer.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Build VCamdroid Client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          msbuild windows/VCamdroid.sln /p:Configuration=Release /p:Platform=x64 /fl /flp:logfile=msbuild_vcamdroid.log;verbosity=normal
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== MSBUILD FAILURE DIAGNOSTICS ==="
            Get-Content msbuild_vcamdroid.log | Select-String -Pattern ": error " | Select-Object -First 40 | ForEach-Object { Write-Host $_.Line }
            exit 1
          }

      - name: Package Runtime Dependencies
        shell: pwsh
        run: |
          if (Test-Path "C:\deps\bin") {
            Copy-Item -Path "C:\deps\bin\*.dll" -Destination "dist\" -Force
          }
          if (Test-Path "C:\vcpkg\installed\x64-windows\bin") {
            Copy-Item -Path "C:\vcpkg\installed\x64-windows\bin\*.dll" -Destination "dist\" -Force
          }

      - name: Upload Windows Dist Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcamdroid-windows-dist
          path: |
            dist/
            msbuild_vcamdroid.log
          retention-days: 2

  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: vcamdroid-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 2

  prune-old-builds:
    needs: [build-windows, build-android]
    if: always() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Prune older runs (keep latest and 1 previous)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUNS=$(gh api -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/runs?per_page=30" \
            --jq '.workflow_runs[] | select(.status=="completed") | .id')
          COUNT=0
          for RUN_ID in $RUNS; do
            COUNT=$((COUNT+1))
            if [ $COUNT -gt 2 ]; then
              echo "Pruning older run: $RUN_ID"
              gh api -X DELETE "/repos/${{ github.repository }}/actions/runs/$RUN_ID" || true
            else
              echo "Preserving recent run: $RUN_ID"
            fi
          done
